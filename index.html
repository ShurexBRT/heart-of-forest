<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07110d" />
  <meta name="color-scheme" content="dark" />
  <meta
    name="description"
    content="Heart of Forest — restore a wounded world as Ayla, a keeper who turns what she discovers into the power to heal each ancient root."
  />
  <title>Heart of Forest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-shell" aria-label="Heart of Forest">
    <canvas
      id="game"
      tabindex="0"
      aria-label="Heart of Forest gameplay"
      aria-describedby="game-help"
    ></canvas>

    <p id="game-help" class="sr-only">
      Use W A S D or the left controller stick to move. Aim with the mouse or right controller stick.
    </p>

    <div id="boot-status" class="boot-status" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">
        <span class="boot-ring boot-ring-outer"></span>
        <span class="boot-ring boot-ring-inner"></span>
        <span class="boot-seed"></span>
      </div>
      <div class="boot-copy">
        <strong>Heart of Forest</strong>
        <span>Listening for the old roots…</span>
      </div>
    </div>

    <section id="fatal-error" class="fatal-error" role="alert" hidden>
      <div class="fatal-card">
        <div class="fatal-glyph" aria-hidden="true">✦</div>
        <h1>The forest fell silent.</h1>
        <p id="fatal-error-message">A fatal error stopped the game.</p>
        <button type="button" onclick="location.reload()">Return to the roots</button>
      </div>
    </section>
  </main>

  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
